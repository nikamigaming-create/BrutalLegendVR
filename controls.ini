; BLVR controls. Saved changes reload during play within 250 ms.
; Invalid files retain the last working layout.
; Use command+ before an action input to require the command chord.
; Input names: a, b, x, y, left_trigger, right_trigger, left_grip, right_grip, left_stick_click, right_stick_click, menu, left_up, left_down, left_left, left_right, right_up, right_down, right_left, right_right, none

[controls]
command_grip=left_grip
command_click=left_stick_click
equip_axe=x
equip_guitar=y
earthshaker_left=left_grip
earthshaker_right=right_grip
wheel_grip=right_grip
command_boost=right_grip
recenter_modifier=menu
recenter_click=right_stick_click
support_left=left_grip
support_right=right_grip
solo_fret=left_grip
solo_accept_alternate=right_trigger
opening_confirm_alternate=right_trigger
movement_stick=left
turn_stick=right
radial_stick=right
opening_menu_stick=right

[actions]
UiA=a
UiB=b
UiX=a
UiY=y
UiStart=menu
UiBack=command+x
UiUp=left_up
UiDown=left_down
UiLeft=left_left
UiRight=left_right
UiTriggerLeft=command+left_trigger
UiTriggerRight=command+right_trigger
UiShoulderLeft=command+b
UiShoulderRight=command+a
Accept=a
Cancel=b
Use=a
Map=command+x
Journal=menu
Axe=right_trigger
Guitar=right_trigger
Evade=b
Block=b
Target=left_trigger
RockStance=right_stick_click
RadialAccept=a
SoloNote1=a
SoloNote2=x
SoloNote3=y
Beacon=command+b
OrderCharge=command+right_up
OrderDefend=command+right_down
OrderMove=command+right_right
OrderFollow=command+right_left
BuildMenu=command+a
CancelBuildItem=x
Fly=command+y
Descend=command+left_trigger
Ascend=command+right_trigger
Handbrake=b
Boost=left_stick_click
AlternateCam=command+b
PrimaryVehicleAttack=right_trigger
SecondaryVehicleAttack=left_trigger
LeftCoopAttack=command+left_trigger
RightCoopAttack=command+right_trigger
PlaylistUI=command+right_up
PlaylistToggle=command+right_down
PlaylistNext=command+right_right
PlaylistPrev=command+right_left
PlaylistRewind=command+right_stick_click
